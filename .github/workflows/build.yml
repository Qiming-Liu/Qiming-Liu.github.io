name: build
on:
  push:
    branches: [dev]
permissions:
  contents: write
jobs:
  Build-Deploy:
    name: Build-Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 🔨 Build
        run: |
          npm ci
          npm run build
      - name: 🎉 Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main
          folder: build
